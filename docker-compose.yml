services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hallucination-aware-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - chroma
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hallucination-aware-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hallucination-aware-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hallucination_aware_ai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: hallucination-aware-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  pg_data:
  chroma_data:
